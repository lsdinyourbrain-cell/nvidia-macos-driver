name: Build NVIDIA macOS Driver

on:
  workflow_dispatch:
    inputs:
      target_macos:
        description: 'Target macOS version'
        type: choice
        options:
          - '15'  # Sequoia
          - '26'  # Tahoe
        default: '26'
      build_type:
        description: 'Build type'
        type: choice
        options:
          - 'release'
          - 'debug'
        default: 'release'

jobs:
  build:
    name: Build on macOS (Xcode 15.4)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TARGET_MACOS: ${{ github.event.inputs.target_macos }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}
      OGKM_VERSION: 610.57.04
      MESA_COMMIT: 17ca6174

    steps:
      - name: Checkout driver repo
        uses: actions/checkout@v4

      - name: Debug - System Info
        run: |
          echo "=== System Info ==="
          uname -a
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          echo "=== Xcode Path ==="
          xcode-select -p
          ls -la /Applications/Xcode*.app 2>/dev/null || echo "No Xcode found"
          echo "=== Disk Space ==="
          df -h /

      - name: Setup Xcode (use default)
        run: |
          # macos-14 has Xcode 15.4 by default
          xcodebuild -version
          # Ensure command line tools are selected
          sudo xcode-select -s /Applications/Xcode.app

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Build Tools
        run: |
          brew install meson ninja cmake pkg-config vulkan-headers
          meson --version
          ninja --version
          cmake --version

      - name: Clone NVIDIA OGKM
        run: |
          git clone --branch ${{ env.OGKM_VERSION }} --depth 1 \
            https://github.com/NVIDIA/open-gpu-kernel-modules.git ~/ogkm610
          echo "OGKM cloned: $(ls -la ~/ogkm610 | head -5)"

      - name: Prepare Mesa for NVK
        run: |
          git clone https://gitlab.freedesktop.org/mesa/mesa.git ~/mesa-nvk
          cd ~/mesa-nvk
          git checkout ${{ env.MESA_COMMIT }}
          # Apply patch with whitespace fix
          git apply --whitespace=nowarn ${{ github.workspace }}/nvk/nvk-macos.patch
          echo "Mesa ready: $(git rev-parse --short HEAD)"

      - name: Build Translator
        run: |
          mkdir -p ~/nvmtl-build/bindless
          rsync -a ${{ github.workspace }}/translator/ ~/nvmtl-build/bindless/
          cd ~/nvmtl-build/bindless
          export PATH="$HOME/.cargo/bin:$PATH"
          export RUSTFLAGS="--remap-path-prefix=$(pwd)=/src --remap-path-prefix=$HOME=/build"
          cargo build --release --manifest-path wrapper/Cargo.toml
          # Find the actual output file (cargo with --manifest-path puts it in wrapper/target/)
          TRANSLATOR_PATH=$(find ~/nvmtl-build/bindless -name "libnvmtl_translate.dylib" -type f 2>/dev/null | head -1)
          echo "Found translator at: '$TRANSLATOR_PATH'"
          if [ -z "$TRANSLATOR_PATH" ] || [ ! -f "$TRANSLATOR_PATH" ]; then
            echo "ERROR: Translator not found!"
            find ~/nvmtl-build/bindless -type f -name "*.dylib" 2>/dev/null
            exit 1
          fi
          strip -S "$TRANSLATOR_PATH"
          install_name_tool -id @rpath/libnvmtl_translate.dylib "$TRANSLATOR_PATH"
          codesign -f -s - "$TRANSLATOR_PATH"
          mkdir -p ${{ github.workspace }}/artifacts/translator
          cp "$TRANSLATOR_PATH" ${{ github.workspace }}/artifacts/translator/
          echo "Translator built: $(ls -la ${{ github.workspace }}/artifacts/translator/)"

      - name: Build Metal Plugin
        run: |
          # Find Vulkan headers installed by Homebrew
          VULKAN_INCLUDE=$(brew --prefix vulkan-headers 2>/dev/null)/include
          if [ ! -f "$VULKAN_INCLUDE/vulkan/vulkan_core.h" ]; then
            VULKAN_INCLUDE="/opt/homebrew/include"
          fi
          if [ ! -f "$VULKAN_INCLUDE/vulkan/vulkan_core.h" ]; then
            VULKAN_INCLUDE="/usr/local/include"
          fi
          echo "Using Vulkan headers from: $VULKAN_INCLUDE"
          
          # Get macOS SDK path and version
          SDK_PATH=$(xcrun --show-sdk-path)
          SDK_VERSION=$(xcrun --show-sdk-version)
          echo "SDK: $SDK_PATH (version $SDK_VERSION)"
          
          mkdir -p ~/nvmtl-build/LIVE/plugin
          rsync -a ${{ github.workspace }}/plugin/ ~/nvmtl-build/LIVE/plugin/
          
          # Apply patch after rsync
          chmod +x ${{ github.workspace }}/patch_plugin_sdk.sh
          ${{ github.workspace }}/patch_plugin_sdk.sh ~/nvmtl-build/LIVE/plugin
          
          cd ~/nvmtl-build/LIVE/plugin
          
          # Build flags with explicit SDK and deployment target for Metal 3 features
          CLANG_FLAGS=(
            -arch x86_64
            -bundle
            -fobjc-arc
            -isysroot "$SDK_PATH"
            -mmacosx-version-min=14.0
            -I"$VULKAN_INCLUDE"
            -framework Foundation
            -framework Metal
            -framework IOSurface
            -Wno-deprecated-declarations
            -Wno-protocol
            -Wno-incomplete-implementation
          )
          
          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            CLANG_FLAGS+=(-O1 -DNVMTL_RELEASE=1)
          else
            CLANG_FLAGS+=(-O0)
          fi
          
          xcrun clang "${CLANG_FLAGS[@]}" -o NVMTLDriver NVMTLDevice.m
          codesign -f -s - NVMTLDriver
          mkdir -p ${{ github.workspace }}/artifacts/plugin
          cp NVMTLDriver ${{ github.workspace }}/artifacts/plugin/
          echo "Plugin built: $(ls -la ${{ github.workspace }}/artifacts/plugin/)"

      - name: Build NVK
        run: |
          cd ~/mesa-nvk
          meson setup build263 \
            -Dbuildtype=debugoptimized \
            -Dvulkan-drivers=nouveau \
            -Dgallium-drivers= \
            -Dplatforms= \
            -Degl=disabled -Dglx=disabled -Dglvnd=disabled -Dllvm=disabled \
            -Dmesa-clc=system -Dshared-glapi=disabled -Dvulkan-layers= \
            -Dtools= -Dbuild-tests=false -Dexpat=disabled -Dzstd=disabled \
            -Dlibunwind=disabled -Dlmsensors=disabled -Dvalgrind=disabled \
            -Dxlib-lease=disabled -Dgallium-rusticl=false -Dspirv-tools=disabled
          meson configure build263 \
            "-Dc_args=-ffile-prefix-map=$(pwd)=/src -ffile-prefix-map=$HOME=/build" \
            "-Dcpp_args=-ffile-prefix-map=$(pwd)=/src -ffile-prefix-map=$HOME=/build" \
            "-Drust_args=--remap-path-prefix=$(pwd)=/src --remap-path-prefix=$HOME=/build"
          ninja -C build263 -k 0 src/nouveau/vulkan/libvulkan_nouveau.dylib
          strip -S build263/src/nouveau/vulkan/libvulkan_nouveau.dylib
          mkdir -p ${{ github.workspace }}/artifacts/nvk
          cp build263/src/nouveau/vulkan/libvulkan_nouveau.dylib ${{ github.workspace }}/artifacts/nvk/
          echo "NVK built: $(ls -la ${{ github.workspace }}/artifacts/nvk/)"

      - name: Build Kernel Extensions
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/kexts
          
          # Build NVAccel
          if [ "${{ env.TARGET_MACOS }}" = "26" ]; then
            NM_TAHOE=1 bash ${{ github.workspace }}/build/accel_build.sh ${{ github.workspace }}/kexts/NVRM/accel ${{ github.workspace }}/artifacts/kexts/26
            cp -r ${{ github.workspace }}/artifacts/kexts/26/NVAccel.kext ${{ github.workspace }}/artifacts/kexts/NVAccel_Tahoe.kext
          else
            bash ${{ github.workspace }}/build/accel_build.sh ${{ github.workspace }}/kexts/NVRM/accel ${{ github.workspace }}/artifacts/kexts/15
            cp -r ${{ github.workspace }}/artifacts/kexts/15/NVAccel.kext ${{ github.workspace }}/artifacts/kexts/NVAccel_Sequoia.kext
          fi
          
          # Build other kexts
          for kext in NVRM NVRMFB NVRMAGDC NMDRM NMHDA NMIntelFB; do
            if [ -f ${{ github.workspace }}/kexts/$kext/build.sh ]; then
              cd ${{ github.workspace }}/kexts/$kext
              bash build.sh
              cp -r *.kext ${{ github.workspace }}/artifacts/kexts/ 2>/dev/null || true
            fi
          done
          echo "Kexts built: $(ls -la ${{ github.workspace }}/artifacts/kexts/)"

      - name: Create Release Package
        run: |
          mkdir -p ${{ github.workspace }}/pkgroot/Library/GPUBundles ${{ github.workspace }}/pkgroot/Library/Extensions ${{ github.workspace }}/pkgroot/Users/Shared/nvfw/nvidia
          
          cp -r ${{ github.workspace }}/artifacts/plugin/NVMTLDriver ${{ github.workspace }}/pkgroot/Library/GPUBundles/NVMTLDriver.bundle
          cp ${{ github.workspace }}/artifacts/translator/libnvmtl_translate.dylib ${{ github.workspace }}/pkgroot/Library/GPUBundles/NVMTLDriver.bundle/
          
          mkdir -p ${{ github.workspace }}/pkgroot/Library/GPUBundles/nvmtl
          cp ${{ github.workspace }}/artifacts/nvk/libvulkan_nouveau.dylib ${{ github.workspace }}/pkgroot/Library/GPUBundles/nvmtl/
          
          cp -r ${{ github.workspace }}/artifacts/kexts/*.kext ${{ github.workspace }}/pkgroot/Library/Extensions/
          
          cat > ${{ github.workspace }}/pkgroot/install.sh << 'INSTALL_EOF'
          #!/bin/bash
          set -euo pipefail
          echo "Installing NVIDIA driver..."
          sudo cp -R Library/GPUBundles/* /Library/GPUBundles/
          sudo cp -R Library/Extensions/* /Library/Extensions/
          sudo kmutil install -u --volume-root /
          echo "Rebuilding Auxiliary Kernel Collection..."
          sudo kmutil trigger-panic-medic --volume-root /
          echo "Done. Reboot required."
          INSTALL_EOF
          chmod +x ${{ github.workspace }}/pkgroot/install.sh
          
          cd ${{ github.workspace }}/pkgroot
          find . -type f \( -name "*.kext" -o -name "*.bundle" -o -name "*.dylib" -o -name "install.sh" \) | \
            xargs shasum -a 256 > SHA256SUMS
          
          cd ${{ github.workspace }}
          tar -czf nullmoth-nvidia-macos${TARGET_MACOS}-${{ github.run_number }}.tar.gz pkgroot
          echo "Package created: $(ls -la nullmoth-nvidia-macos${TARGET_MACOS}-${{ github.run_number }}.tar.gz)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-driver-macos${{ env.TARGET_MACOS }}-${{ env.BUILD_TYPE }}
          path: |
            artifacts/**
            nullmoth-nvidia-macos${{ env.TARGET_MACOS }}-*.tar.gz
          retention-days: 30